<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPU · individual page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f4f8fe;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .page {
            max-width: 1100px;
            width: 100%;
        }

        /* header / panel */
        .panel-header {
            background: white;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            border: 1px solid #e6edf5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: #0b1e33;
        }
        .logo i {
            color: #2563eb;
            margin-right: 8px;
        }
        .badge {
            background: #eef3f9;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e2a3a;
        }
        .badge i {
            margin-right: 6px;
            color: #2563eb;
        }

        /* product grid — GPU cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 1.8rem 0.8rem 1.2rem;
            text-align: center;
            border: 1px solid #eef2f6;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.01);
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: #c8d6e6;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.06);
        }
        .card .icon {
            font-size: 2.8rem;
            color: #1a2a3a;
            margin-bottom: 6px;
        }
        .card .name {
            font-weight: 600;
            font-size: 1.05rem;
            color: #0b1e33;
        }
        .card .spec {
            font-size: 0.78rem;
            color: #4b5b6b;
            background: #f0f4fa;
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            margin: 6px 0 4px;
        }
        .card .price {
            font-weight: 700;
            color: #0b1e33;
            margin-top: 6px;
            font-size: 1.1rem;
        }
        .card .price small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #6b7b8b;
        }

        /* footer */
        .footer {
            margin-top: 2.5rem;
            background: white;
            border-radius: 40px;
            padding: 0.7rem 2rem;
            border: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #2a4055;
        }
        .footer i {
            color: #2563eb;
            margin-right: 4px;
        }

        @media (max-width: 500px) {
            .panel-header {
                flex-direction: column;
                gap: 0.6rem;
                align-items: stretch;
                text-align: center;
            }
            .badge {
                align-self: center;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- main panel header -->
        <div class="panel-header">
            <div class="logo"><i class="fas fa-gamepad"></i> GPU · Page</div>
            <div class="badge"><i class="fas fa-credit-card"></i> 6 graphics cards · individual</div>
        </div>

        <!-- GPU product grid -->
        <div class="grid">
            <div class="card">
                <div class="icon"><i class="fas fa-gamepad"></i></div>
                <div class="name">RTX 4090</div>
                <div class="spec">24GB GDDR6X</div>
                <div class="price">$1599 <small>USD</small></div>
            </div>
            <div class="card">
                <div class="icon"><i class="fas fa-gamepad"></i></div>
                <div class="name">RTX 4080</div>
                <div class="spec">16GB GDDR6X</div>
                <div class="price">$1199 <small>USD</small></div>
            </div>
            <div class="card">
                <div class="icon"><i class="fas fa-gamepad"></i></div>
                <div class="name">RX 7900 XTX</div>
                <div class="spec">24GB GDDR6</div>
                <div class="price">$999 <small>USD</small></div>
            </div>
            <div class="card">
                <div class="icon"><i class="fas fa-gamepad"></i></div>
                <div class="name">RTX 4070 Ti</div>
                <div class="spec">12GB GDDR6X</div>
                <div class="price">$799 <small>USD</small></div>
            </div>
            <div class="card">
                <div class="icon"><i class="fas fa-gamepad"></i></div>
                <div class="name">RX 7800 XT</div>
                <div class="spec">16GB GDDR6</div>
                <div class="price">$529 <small>USD</small></div>
            </div>
            <div class="card">
                <div class="icon"><i class="fas fa-gamepad"></i></div>
                <div class="name">RTX 4060</div>
                <div class="spec">8GB GDDR6</div>
                <div class="price">$299 <small>USD</small></div>
            </div>
        </div>

        <!-- dummy panel footer -->
        <div class="footer">
            <span><i class="fas fa-cubes"></i> GPU category · individual page</span>
            <span><i class="fas fa-arrow-right"></i> dummy panel view</span>
        </div>
    </div>
</body>
</html>
